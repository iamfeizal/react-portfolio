<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="ocrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ocrAmberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ocrGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="ocrBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#ocrBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="8" y="8" width="284" height="284" rx="18" fill="url(#ocrGlow)" stroke="url(#ocrAmberViolet)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Center Graphic: License Plate with OCR Scanner Bounding Box -->
  <g transform="translate(150, 115)">
    <!-- Glow -->
    <circle r="46" fill="#f59e0b" opacity="0.12" filter="url(#ocrBlur)" />
    
    <!-- Camera viewfinder corners -->
    <path d="M -48 -35 L -48 -45 L -38 -45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 48 -35 L 48 -45 L 38 -45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -48 35 L -48 45 L -38 45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 48 35 L 48 45 L 38 45" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- License Plate Frame -->
    <rect x="-42" y="-20" width="84" height="36" rx="6" fill="#000000" stroke="#cbd5e1" stroke-width="2" />
    <!-- White border inside plate -->
    <rect x="-39" y="-17" width="78" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="1" />
    <!-- Plate Number -->
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="14" font-weight="900" letter-spacing="2">
      AB 1234 XY
    </text>

    <!-- Scan Line over plate -->
    <line x1="-40" y1="-2" x2="40" y2="-2" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    
    <!-- Docker Container / Fast API badge -->
    <g transform="translate(0, 32)">
      <rect x="-32" y="-7" width="64" height="14" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
      <text x="0" y="3" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">DOCKER • UVICORN</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="150" y="210" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    Plate Recognition OCR
  </text>
  <text x="150" y="234" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
    PADDLEOCR • FLASK • UVICORN
  </text>
  <text x="150" y="262" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    Vehicle License Plate AI Microservice
  </text>
</svg>
