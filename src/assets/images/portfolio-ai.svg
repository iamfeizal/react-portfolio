<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="8" y="8" width="284" height="284" rx="18" fill="url(#glowGrad)" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Central Graphic: AI Chat / Sparks -->
  <g transform="translate(150, 120)">
    <!-- Glow circle -->
    <circle r="46" fill="#0891b2" opacity="0.15" filter="url(#glow)" />
    <circle r="40" fill="#0f172a" stroke="url(#cyanPurple)" stroke-width="2" />
    
    <!-- Sparkles / AI Icon -->
    <path d="M 0 -22 L 4 -7 L 19 -4 L 4 -1 L 0 14 L -4 -1 L -19 -4 L -4 -7 Z" fill="url(#cyanPurple)" />
    <path d="M 16 -16 L 18 -9 L 25 -7 L 18 -5 L 16 2 L 14 -5 L 7 -7 L 14 -9 Z" fill="#38bdf8" />
    <path d="M -16 10 L -14 15 L -9 17 L -14 19 L -16 24 L -18 19 L -23 17 L -18 15 Z" fill="#c084fc" />

    <!-- Chat bubble silhouette -->
    <path d="M -26 26 C -32 26, -36 22, -36 16 L -36 -10 C -36 -16, -32 -20, -26 -20 L 26 -20 C 32 -20, 36 -16, 36 -10 L 36 16 C 36 22, 32 26, 26 26 L 6 26 L -4 34 L -2 26 Z" 
          fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.5" stroke-dasharray="4 4" />
  </g>

  <!-- Typography -->
  <text x="150" y="210" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
    AI Portfolio Assistant
  </text>
  <text x="150" y="234" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
    REACT • GEMINI API • LLM
  </text>
  <text x="150" y="262" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    Interactive Persona Assistant
  </text>
</svg>
